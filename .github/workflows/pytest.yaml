name: pytest
on:
  push:
    branches:
      # Run tests for change on the main branch ...
      - main
    tags-ignore:
      # ... but not for tags (avoids duplicate work).
      - '**'
    paths:
      # ... and only if relevant files have changed.
      - src/**
      - tests/**
      - pyproject.toml
      - .github/requirements-old.txt
      - .github/workflows/pytest.yaml
  pull_request:
  # Run tests on pull requests ..
    paths:
      # ... and only if relevant files have changed.
      - src/**
      - tests/**
      - pyproject.toml
      - .github/requirements-old.txt
      - .github/workflows/pytest.yaml

jobs:
  tests:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            .github/requirements-old.txt
      - name: Install oldest versions of supported dependencies
        if: ${{ matrix.python-version == '3.11'}}
        run: uv pip install --system -r .github/requirements-old.txt
      - name: Install package with test dependencies
        run: uv pip install --system -e .[tests]
      - name: Run pytest
        run: pytest -vv ${{ matrix.python-version == '3.11' && '-W ignore::Warning' || '' }}
